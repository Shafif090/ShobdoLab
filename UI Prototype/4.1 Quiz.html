<!doctype html>
<html lang="en">
  <head>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest" };
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShobdoLab - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                bg: "#FAFAFA",
                text: "#111827",
                orange: "#F47C7C",
                blue: "#8E9BFA",
                green: "#A1E8AF",
                yellow: "#FFC800",
                purple: "#E9D5FF",
                border: "#E5E7EB",
              },
            },
            boxShadow: {
              soft: "0 4px 20px -2px rgba(0,0,0,0.05)",
              card: "0 2px 10px rgba(0,0,0,0.02)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #fafafa;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .bg-grid {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="bg-brand-bg text-brand-text min-h-[100dvh] overflow-x-hidden bg-grid">
    <!-- Full-screen flex layout -->
    <div class="min-h-[100dvh] flex flex-col bg-white">
      <!-- Header -->
      <header
        class="px-4 md:px-0 pt-12 md:pt-6 pb-4 bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-brand-border">
        <div
          class="w-full md:max-w-2xl md:mx-auto flex items-center gap-3 px-0 md:px-6">
          <button
            aria-label="Close"
            class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50 transition-colors shrink-0">
            <i class="fa-solid fa-xmark text-sm" aria-hidden="true"></i>
          </button>
          <div
            class="flex-1"
            role="progressbar"
            aria-valuenow="30"
            aria-valuemin="0"
            aria-valuemax="100">
            <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
              <div
                class="h-full bg-brand-blue w-[30%] rounded-full transition-all duration-300"></div>
            </div>
          </div>
          <span
            class="text-sm font-bold text-gray-400 shrink-0"
            aria-label="Question 3 of 10"
            >3/10</span
          >
        </div>
      </header>

      <!-- Main -->
      <main class="flex-1 overflow-y-auto no-scrollbar pb-32 px-6 pt-8">
        <div class="w-full md:max-w-xl md:mx-auto flex flex-col gap-8">
          <!-- Question Prompt -->
          <div class="flex flex-col gap-4 text-center mt-4">
            <span
              class="text-xs font-bold text-brand-blue uppercase tracking-wider"
              >What is the meaning of following word?</span
            >
            <h2 class="text-3xl font-extrabold text-gray-900">Perfidious</h2>
            <div class="flex items-center justify-center gap-2 mt-2">
              <button
                aria-label="Play audio"
                class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors focus:ring-2 focus:ring-brand-blue focus:outline-none">
                <i
                  class="fa-solid fa-volume-high text-xs"
                  aria-hidden="true"></i>
              </button>
              <button
                aria-label="Play audio slowly"
                class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors focus:ring-2 focus:ring-brand-blue focus:outline-none">
                <i class="fa-solid fa-turtle text-xs" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <!-- MCQ Options -->
          <div
            class="flex flex-col gap-3 mt-4"
            role="radiogroup"
            aria-label="Multiple choice options">
            <button
              role="radio"
              aria-checked="false"
              class="w-full text-left p-4 rounded-2xl border-2 border-brand-border bg-white shadow-sm hover:border-gray-300 focus:border-brand-blue focus:outline-none transition-all flex items-center justify-between group">
              <span
                class="text-base font-semibold text-gray-700 group-hover:text-gray-900"
                >অনধিগম্য</span
              >
              <div
                class="w-6 h-6 rounded-full border-2 border-gray-200 flex items-center justify-center group-hover:border-gray-300 transition-colors"></div>
            </button>
            <button
              role="radio"
              aria-checked="false"
              class="w-full text-left p-4 rounded-2xl border-2 border-brand-border bg-white shadow-sm hover:border-gray-300 focus:border-brand-blue focus:outline-none transition-all flex items-center justify-between group">
              <span
                class="text-base font-semibold text-gray-700 group-hover:text-gray-900"
                >প্রংশসনীয়</span
              >
              <div
                class="w-6 h-6 rounded-full border-2 border-gray-200 flex items-center justify-center group-hover:border-gray-300 transition-colors"></div>
            </button>
            <button
              role="radio"
              aria-checked="true"
              class="w-full text-left p-4 rounded-2xl border-2 border-brand-green bg-brand-green/10 shadow-sm transition-all flex items-center justify-between">
              <span class="text-base font-bold text-gray-900">বিশ্বাসঘাতক</span>
              <div
                class="w-6 h-6 rounded-full bg-brand-green text-white flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-check text-xs" aria-hidden="true"></i>
              </div>
            </button>
            <button
              role="radio"
              aria-checked="false"
              class="w-full text-left p-4 rounded-2xl border-2 border-brand-border bg-white shadow-sm hover:border-gray-300 focus:border-brand-blue focus:outline-none transition-all flex items-center justify-between group">
              <span
                class="text-base font-semibold text-gray-700 group-hover:text-gray-900"
                >জনসমাবেশ</span
              >
              <div
                class="w-6 h-6 rounded-full border-2 border-gray-200 flex items-center justify-center group-hover:border-gray-300 transition-colors"></div>
            </button>
          </div>

          <!-- Feedback -->
          <div
            class="bg-brand-green/10 border border-brand-green/20 rounded-2xl p-4 flex gap-3 items-start mt-2">
            <div
              class="w-8 h-8 rounded-full bg-brand-green text-white flex items-center justify-center shrink-0 mt-0.5">
              <i class="fa-solid fa-thumbs-up text-sm"></i>
            </div>
            <div class="flex flex-col">
              <h4 class="text-sm font-bold text-gray-900">Excellent!</h4>
              <p class="text-xs text-gray-600 mt-1">
                "Perfidious" means বিশ্বাসঘাতক!
              </p>
            </div>
          </div>
        </div>
      </main>

      <!-- Action Footer -->
      <div
        class="border-t border-gray-100 bg-white/90 backdrop-blur-sm px-6 py-4">
        <div class="w-full md:max-w-xl md:mx-auto">
          <a href="4.3 Result.html">
            <button
              class="w-full bg-brand-blue text-white font-extrabold text-lg py-4 rounded-2xl shadow-[0_8px_20px_-4px_rgba(142,155,250,0.4)] transform hover:scale-[1.02] active:scale-95 transition-all flex justify-center items-center gap-2">
              Continue <i class="fa-solid fa-arrow-right text-sm ml-1"></i>
            </button>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
