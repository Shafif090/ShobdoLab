<!doctype html>
<html lang="en">
  <head>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest" };
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShobdoLab - Revise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                bg: "#FAFAFA",
                text: "#111827",
                orange: "#F47C7C",
                blue: "#8E9BFA",
                green: "#A1E8AF",
                yellow: "#FFC800",
                purple: "#E9D5FF",
                border: "#E5E7EB",
              },
            },
            boxShadow: {
              soft: "0 4px 20px -2px rgba(0,0,0,0.05)",
              card: "0 2px 10px rgba(0,0,0,0.02)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #fafafa;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .bg-grid {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 16px;
        color: #6b7280;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: all 0.15s;
      }
      .sidebar-link:hover {
        background: #f9fafb;
        color: #111827;
      }
      .sidebar-link.active {
        background: rgba(244, 124, 124, 0.1);
        color: #f47c7c;
      }
      .sidebar-link .icon {
        width: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body class="bg-brand-bg text-brand-text min-h-[100dvh] overflow-x-hidden">
    <div id="app-container" class="flex min-h-[100dvh] bg-white bg-grid">
      <!-- Sidebar -->
      <aside
        class="hidden md:flex flex-col w-64 lg:w-72 bg-white border-r border-brand-border sticky top-0 h-screen shrink-0 overflow-y-auto">
        <div class="p-6 flex flex-col gap-6 h-full">
          <div class="flex items-center gap-3 pt-2">
            <div
              class="w-11 h-11 rounded-[14px] bg-brand-orange flex items-center justify-center shadow-[0_3px_0_0_#000] border-2 border-black shrink-0">
              <i class="fa-solid fa-book-open text-white text-sm"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tight text-brand-text"
              >ShobdoLab</span
            >
          </div>
          <nav class="flex flex-col gap-1 flex-1 mt-2">
            <a href="1 Home Hub.html" class="sidebar-link"
              ><i class="fa-solid fa-house icon"></i><span>Home</span></a
            >
            <a href="2 Learn.html" class="sidebar-link"
              ><i class="fa-solid fa-book icon"></i><span>Learn</span></a
            >
            <a href="3 Revise.html" class="sidebar-link active"
              ><i class="fa-solid fa-rotate-right icon"></i
              ><span>Revise</span></a
            >
            <a href="4 Exercise.html" class="sidebar-link"
              ><i class="fa-solid fa-dumbbell icon"></i><span>Exercise</span></a
            >
          </nav>
          <div
            class="bg-brand-purple/20 border border-brand-purple/30 rounded-2xl p-4 flex items-center gap-3">
            <div
              class="w-9 h-9 rounded-full bg-brand-purple flex items-center justify-center text-purple-700 shrink-0">
              <i class="fa-solid fa-fire text-sm"></i>
            </div>
            <div>
              <p class="text-sm font-bold text-gray-900">12-Day Streak!</p>
              <p class="text-xs text-gray-500">Keep it up 🔥</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Content -->
      <div
        class="flex-1 flex flex-col md:overflow-y-auto min-h-[100dvh] md:min-h-0">
        <!-- Header -->
        <header
          class="px-6 md:px-10 pt-12 md:pt-6 pb-4 flex justify-between items-center bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-brand-border">
          <div class="flex items-center gap-3">
            <button
              class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50 transition-colors md:hidden">
              <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <h1 class="text-xl font-bold tracking-tight text-brand-text">
              Revise
            </h1>
          </div>
          <button
            class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50 transition-colors">
            <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
          </button>
        </header>

        <!-- Main -->
        <main
          class="flex-1 no-scrollbar pb-24 md:pb-12 px-6 md:px-10 pt-6 flex flex-col gap-6">
          <div class="md:max-w-2xl md:mx-auto w-full flex flex-col gap-6">
            <div class="flex flex-col gap-1 mb-2">
              <h2 class="text-2xl font-bold text-gray-900">
                Your Daily Revision
              </h2>
              <p class="text-sm text-gray-500">
                Keep your memory fresh. Focus on what matters.
              </p>
            </div>

            <!-- Due Today -->
            <div
              class="bg-brand-orange/10 border-2 border-brand-orange/20 rounded-[24px] p-5 flex flex-col gap-4 shadow-soft relative overflow-hidden">
              <div class="flex justify-between items-start z-10">
                <div class="flex items-center gap-3">
                  <div
                    class="w-12 h-12 rounded-full bg-brand-orange/20 flex items-center justify-center text-brand-orange">
                    <i class="fa-solid fa-calendar-day text-xl"></i>
                  </div>
                  <div class="flex flex-col">
                    <h3 class="text-lg font-bold text-gray-900">Due Today</h3>
                    <p class="text-xs text-gray-600 font-medium">
                      Spaced repetition
                    </p>
                  </div>
                </div>
                <div
                  class="bg-white px-3 py-1 rounded-full shadow-sm flex items-center gap-1 border border-brand-orange/10">
                  <span class="text-sm font-bold text-brand-orange">24</span>
                  <span
                    class="text-[10px] text-gray-500 font-medium uppercase tracking-wider"
                    >Words</span
                  >
                </div>
              </div>
              <button
                class="w-full bg-brand-orange text-white font-bold text-sm py-3.5 rounded-[16px] shadow-sm transform hover:-translate-y-0.5 active:translate-y-0 transition-transform flex justify-center items-center gap-2 mt-2 z-10">
                Revise Now <i class="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </div>

            <!-- Weak Words -->
            <div
              class="bg-brand-blue/10 border-2 border-brand-blue/20 rounded-[24px] p-5 flex flex-col gap-4 shadow-soft relative overflow-hidden">
              <div class="flex justify-between items-start z-10">
                <div class="flex items-center gap-3">
                  <div
                    class="w-12 h-12 rounded-full bg-brand-blue/20 flex items-center justify-center text-brand-blue">
                    <i class="fa-solid fa-dumbbell text-xl"></i>
                  </div>
                  <div class="flex flex-col">
                    <h3 class="text-lg font-bold text-gray-900">Weak Words</h3>
                    <p class="text-xs text-gray-600 font-medium">
                      Needs more practice
                    </p>
                  </div>
                </div>
                <div
                  class="bg-white px-3 py-1 rounded-full shadow-sm flex items-center gap-1 border border-brand-blue/10">
                  <span class="text-sm font-bold text-brand-blue">12</span>
                  <span
                    class="text-[10px] text-gray-500 font-medium uppercase tracking-wider"
                    >Words</span
                  >
                </div>
              </div>
              <button
                class="w-full bg-brand-blue text-white font-bold text-sm py-3.5 rounded-[16px] shadow-sm transform hover:-translate-y-0.5 active:translate-y-0 transition-transform flex justify-center items-center gap-2 mt-2 z-10">
                Strengthen <i class="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </div>

            <!-- Recent -->
            <div
              class="bg-brand-green/10 border-2 border-brand-green/20 rounded-[24px] p-5 flex flex-col gap-4 shadow-soft relative overflow-hidden">
              <div class="flex justify-between items-start z-10">
                <div class="flex items-center gap-3">
                  <div
                    class="w-12 h-12 rounded-full bg-brand-green/20 flex items-center justify-center text-brand-green">
                    <i class="fa-solid fa-clock-rotate-left text-xl"></i>
                  </div>
                  <div class="flex flex-col">
                    <h3 class="text-lg font-bold text-gray-900">Recent</h3>
                    <p class="text-xs text-gray-600 font-medium">
                      All learned words
                    </p>
                  </div>
                </div>
                <div
                  class="bg-white px-3 py-1 rounded-full shadow-sm flex items-center gap-1 border border-brand-green/10">
                  <span class="text-sm font-bold text-brand-green">50</span>
                  <span
                    class="text-[10px] text-gray-500 font-medium uppercase tracking-wider"
                    >Words</span
                  >
                </div>
              </div>
              <button
                class="w-full bg-brand-green text-gray-900 font-bold text-sm py-3.5 rounded-[16px] shadow-sm transform hover:-translate-y-0.5 active:translate-y-0 transition-transform flex justify-center items-center gap-2 mt-2 z-10">
                Quick Review <i class="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Bottom Nav (mobile only) -->
    <nav
      class="fixed bottom-0 left-0 right-0 md:hidden bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-50 pb-8">
      <a
        href="1 Home Hub.html"
        class="flex flex-col items-center gap-1 text-gray-400 hover:text-black transition-colors">
        <div class="w-10 h-10 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-house text-lg"></i>
        </div>
        <span class="text-[10px] font-medium">Home</span>
      </a>
      <a
        href="2 Learn.html"
        class="flex flex-col items-center gap-1 text-gray-400 hover:text-black transition-colors">
        <div class="w-10 h-10 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-book text-lg"></i>
        </div>
        <span class="text-[10px] font-medium">Learn</span>
      </a>
      <a
        href="3 Revise.html"
        class="flex flex-col items-center gap-1 text-black">
        <div
          class="w-10 h-10 rounded-full bg-brand-orange/10 flex items-center justify-center text-brand-orange">
          <i class="fa-solid fa-rotate-right text-lg"></i>
        </div>
        <span class="text-[10px] font-semibold text-brand-orange">Revise</span>
      </a>
      <a
        href="4 Exercise.html"
        class="flex flex-col items-center gap-1 text-gray-400 hover:text-black transition-colors">
        <div class="w-10 h-10 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-dumbbell text-lg"></i>
        </div>
        <span class="text-[10px] font-medium">Exercise</span>
      </a>
    </nav>
  </body>
</html>
